<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>zvqn</title>

    <style>
        :root {
            --bg: #09090b;
            --fg: #fafafa;
            --muted: #71717a;
            --card: #111113;
            --border: #27272a;
            --hover: #18181b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--fg);
            font: 14px Inter,system-ui,sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        #a {
            width: min(100% - 32px, 440px);
            transform: translateY(-90px);
        }

        #p {
            text-align: center;
            margin-bottom: 28px;
        }

        #p img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }

        #n {
            margin: 0;
            font-size: 25px;
            font-weight: 600;
        }

        #d {
            margin: 7px 0 0;
            font-size: 18px;
            font-weight: 400;
            color: var(--muted);
        }

        #l {
            display: grid;
            gap: 12px;
        }

        .l {
		    position: relative;
		    height: 64px;
		    display: flex;
		    align-items: center;
		    gap: 16px;
		    padding: 0 18px;
		    background: var(--card);
		    border-radius: 10px;
		    transition: .15s ease;
		    -webkit-tap-highlight-color: transparent;
		    outline: none;
		}

        .l:hover {
            background: var(--hover);
            transform: translateY(-1px);
        }

        .i {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex: 0 0 30px;
        }

        .i svg, .i img {
            width: 30px;
            height: 30px;
            filter: brightness(0) invert(1);
        }

        .t {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 500;
        }
        
        footer {
		    position: fixed;
		    bottom: 24px;
		    left: 0;
		    width: 100%;
		    text-align: center;
		}
		
		footer a {
		    color: var(--muted);
		    font-size: 13px;
		}
		
		footer a:hover {
		    color: var(--fg);
		}
    </style>
</head>

<body>
    <main id="a">
        <section id="p"></section>
        <section id="l"></section>
    </main>

    <footer>
        <a href="https://github.com/zvqn/LinkTree" target="_blank" rel="noopener noreferrer">
            Open Source
        </a>
    </footer>

    <script type="module">
        import Config from "./config.js";

        const $ = (s,e=document) => e.querySelector(s);

        const E = (t,c) => {
            const e = document.createElement(t);
            if (c) e.className = c;
            return e;
        };

        const p = $("#p");
        const l = $("#l");

        p.innerHTML = `
            ${Config.Profile?.ProfileUrl ? `<img src="${Config.Profile.ProfileUrl}" alt="">` : ""}
            <h1 id="n">${Config.Profile?.Name ?? "Unknown"}</h1>
            <p id="d">${Config.Profile?.Description ?? ""}</p>
        `;

        for (const [k,v] of Object.entries(Config)) {
            if (k === "Profile" || !v?.DestUrl) continue;

            const a = E("a","l");
            a.href = v.DestUrl;
            a.target = "_blank";
            a.rel = "noopener noreferrer";

            a.innerHTML = `<span class="i"><img src="./brand/${(v.Icon ?? k).toLowerCase()}.svg" alt="${v.Name ?? k} icon" loading="lazy"></span><span class="t">${v.Name ?? k}</span>`;

            l.append(a);
        }
    </script>
</body>
</html>
