<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>zvqn</title>

    <style>
        :root {
            --bg: #09090b;
            --fg: #fafafa;
            --muted: #71717a;
            --card: #111113;
            --border: #27272a;
            --hover: #18181b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--fg);
            font: 14px Inter,system-ui,sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        #a {
            width: min(100% - 32px, 440px);
            transform: translateY(-90px);
        }

        #p {
            text-align: center;
            margin-bottom: 28px;
        }

        #p img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }

        #n {
            margin: 0;
            font-size: 25px;
            font-weight: 600;
        }

        #d {
            margin: 7px 0 0;
            font-size: 18px;
            font-weight: 400;
            color: var(--muted);
        }

        #l {
            display: grid;
            gap: 12px;
        }

        .l {
            min-height: 60px;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 18px;
            background: var(--card);
            /* border: 1px solid var(--border); */
            border-radius: 12px;
            transition: .15s ease;
        }

        .l:hover {
            background: var(--hover);
            transform: translateY(-1px);
        }

        .i {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex: 0 0 30px;
        }

        .i svg {
            width: 30px;
            height: 30px;
        }

        .t {
            font-weight: 500;
        }
    </style>
</head>

<body>
    <main id="a">
        <section id="p"></section>
        <section id="l"></section>
    </main>

    <script type="module">
        import C from "./config.js";

        const $ = (s,e=document) => e.querySelector(s);

        const E = (t,c) => {
            const e = document.createElement(t);
            if (c) e.className = c;
            return e;
        };

        const I = {
            Discord: `<svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.5 5.3A16.7 16.7 0 0 0 15.4 4l-.5 1a15 15 0 0 0-3-.3c-1 0-2 .1-3 .3l-.5-1a16.7 16.7 0 0 0-4.1 1.3C1.7 9.2 1 13 1.2 16.7a16.7 16.7 0 0 0 5.1 2.6l1.2-1.7a10.8 10.8 0 0 1-1.9-.9l.5-.4c3.7 1.7 7.8 1.7 11.5 0l.5.4c-.6.4-1.2.7-1.9.9l1.2 1.7a16.7 16.7 0 0 0 5.1-2.6c.3-4.3-.7-8-3-11.4ZM8.7 14.5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Zm6.6 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Z"/>
            </svg>`,

            Reddit: `<svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4a8 8 0 1 0 7.4 11.1l1.4 1.4 1.1-1.1-1.5-1.5A8 8 0 0 0 12 4Zm-3 6.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm6 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm-5.3 4.2c1.3 1 3.3 1 4.6 0l.8 1c-1.8 1.5-4.4 1.5-6.2 0l.8-1Z"/>
            </svg>`,

            Default: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8v8M8 12h8"/>
            </svg>`
        };

        const p = $("#p");
        const l = $("#l");

        p.innerHTML = `
            ${C.Profile?.ProfileUrl ? `<img src="${C.Profile.ProfileUrl}" alt="">` : ""}
            <h1 id="n">${C.Profile?.Name ?? "Unknown"}</h1>
            <p id="d">${C.Profile?.Description ?? ""}</p>
        `;

        for (const [k,v] of Object.entries(C)) {
            if (k === "Profile" || !v?.DestUrl) continue;

            const a = E("a","l");

            a.href = v.DestUrl;
            a.target = "_blank";
            a.rel = "noopener noreferrer";

            a.innerHTML = `
                <span class="i">${I[v.Icon] ?? I.Default}</span>
                <span class="t">${v.Name ?? k}</span>
            `;

            l.append(a);
        }
    </script>
</body>
</html>
